<meta name="application-name" content="Scorecard SSMA Agrícola">
<meta name="apple-mobile-web-app-title" content="SSMA Agrícola">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: coluna de filtros fixa à esquerda (logo no topo), tira de cores da marca no alto, telas Visão Geral, Regionais, Ranking e Mapa à direita. Fundo branco. */
:root{
  --bg:#ffffff; --panel:#f6f8f3; --ink:#18291f; --ink2:#465a4d; --muted:#6f7f74; --line:#e0e7dd;
  --brand:#006B2D; --brand2:#76B729; --focus:#0a7d38;
  --s1:#50A146; --s2:#A2C63E; --s3:#F1BC27; --s4:#F39232; --s5:#E7672D;
  --zero:#C00000; --minimo:#FFD03B; --medio:#F2F731; --target:#92D050; --meta:#FF1F1F;
  --font-display:'Nunito','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
.strip{height:8px;background:linear-gradient(90deg,var(--s1) 0 5%,var(--s2) 5% 35%,var(--s3) 35% 65%,var(--s4) 65% 95%,var(--s5) 95% 100%)}
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:calc(100vh - 8px)}
.side{border-right:1px solid var(--line);padding:20px 18px 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;background:var(--bg)}
.logo{display:block;width:176px;max-width:100%;height:auto}
.side h2{font:800 11px/1 var(--font-display);letter-spacing:.09em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.field{display:flex;flex-direction:column;min-width:0}
.checks{display:flex;flex-direction:column;gap:2px}
.chk{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;cursor:pointer;min-width:0}
.chk:hover{background:var(--panel)}
.chk input{accent-color:var(--brand);width:16px;height:16px;margin:0;flex:none}
.chk span{overflow-wrap:anywhere}
.chk small{margin-left:auto;color:var(--muted);font-size:11px;flex:none}
.scroll{max-height:236px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px}
.grp{font:800 10.5px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);padding:9px 8px 4px}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
select:focus-visible,button:focus-visible,input:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{font:800 14px var(--font-display);border-radius:8px;padding:10px 14px;border:2px solid var(--brand);cursor:pointer;width:100%;background:var(--brand);color:#fff;display:block;text-align:center}
.btn:hover{background:#005524;border-color:#005524}
.btn.alt{background:var(--bg);color:var(--brand)}
.btn.alt:hover{background:var(--panel)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--brand);border-color:var(--brand)}
.btn.alt[disabled]:hover{background:var(--bg)}
.upl{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.upl input[type=file]{display:none}
.upd{font-size:12px;color:var(--ink2);line-height:1.4;padding:9px 10px;border-radius:6px;background:var(--panel)}
.upd b{display:block;font:800 11px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:2px}
.main{padding:18px max(20px,env(safe-area-inset-right,0px)) 40px 24px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.top h1{font:800 26px/1.1 var(--font-display);margin:0;color:var(--brand);text-wrap:balance}
.top p{margin:4px 0 0;color:var(--ink2)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{font:800 15px var(--font-display);background:none;border:0;padding:10px 18px;color:var(--ink2);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--s3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--ink2)}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.28);flex:none}
.metadash{width:22px;height:0;border-top:3px dashed var(--meta);flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.tile{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg);min-width:0}
.tile .k{font:800 11px/1.2 var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.tile .v{font:800 32px/1.1 var(--font-display);margin-top:8px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tile .s{margin-top:6px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.chip{font:800 11px var(--font-display);padding:3px 9px;border-radius:99px;border:1px solid rgba(0,0,0,.25);color:#1b1b1b;white-space:nowrap}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--bg);min-width:0}
.card h3{font:800 17px/1.2 var(--font-display);margin:0;color:var(--ink)}
.card .sub{color:var(--muted);font-size:12px;margin:3px 0 10px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.cardhead>div:first-child{min-width:0}
.hr{display:flex;align-items:center;gap:10px;flex:none}
.cam{display:inline-flex;align-items:center;gap:6px;font:800 12px var(--font-display);color:var(--brand);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.cam:hover{border-color:var(--brand);background:var(--panel)}
.cam svg{width:16px;height:16px;flex:none}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tg input{accent-color:var(--brand)}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;margin-top:14px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px}
.chart svg{display:block;max-width:100%;height:auto;overflow:visible}
.ax{fill:#6f7f74;font-size:11px}
.vl{fill:#18291f;font-size:12px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.nd{fill:#6f7f74;font-size:11px;font-style:italic}
.mt{fill:#465a4d;font-size:11px;font-weight:700}
.bar{stroke:rgba(0,0,0,.28);stroke-width:1}
.dim{opacity:.32}
.chart text,.exp text{font-family:'Nunito Sans','Trebuchet MS',Arial,sans-serif;font-variant-numeric:tabular-nums}
.ml{fill:#18291f;font-size:10.5px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.mm{fill:#6f7f74;font-size:10px;font-style:italic}
.pt{cursor:pointer;stroke:#18291f;stroke-width:1.6}
.rk{display:flex;flex-direction:column;gap:5px}
.rk-row{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 60px;align-items:center;gap:10px;padding:2px 0}
.rk-row.reg{padding:6px 0 7px;border-bottom:1px solid var(--line);margin-bottom:3px}
.rk-row.reg .rk-name{font:800 14px var(--font-display);color:var(--brand)}
.rk-name{font-size:13px;overflow-wrap:anywhere;line-height:1.2}
.rk-name i{font-style:normal;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:5px;white-space:nowrap}
.rk-name em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.rk-track{position:relative;height:16px;background:var(--panel);border-radius:3px}
.reg .rk-track{height:20px}
.rk-bar{position:absolute;left:0;top:0;bottom:0;border-radius:3px;border:1px solid rgba(0,0,0,.28)}
.rk-meta{position:absolute;top:-3px;bottom:-3px;width:0;border-left:3px dashed var(--meta);transform:translateX(-1.5px)}
.rk-val{font:700 13px var(--font-body);text-align:right;font-variant-numeric:tabular-nums}
.rp{display:grid;grid-template-columns:34px minmax(110px,220px) minmax(0,1fr) 62px 74px;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.rp:last-child{border-bottom:0}
.rp .pos{font:800 15px var(--font-display);color:var(--brand);text-align:right;font-variant-numeric:tabular-nums}
.rp .rk-track{height:20px}
.units{max-height:560px;overflow:auto;padding-right:6px}
.big{font:800 26px/1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.mapwrap{position:relative}
.mapwrap svg{display:block;width:100%;height:auto;max-width:760px;margin:0 auto}
#tip{position:fixed;z-index:50;pointer-events:none;background:#18291f;color:#fff;font-size:12px;line-height:1.35;padding:7px 10px;border-radius:6px;max-width:280px;opacity:0;transition:opacity .08s}
.msg{font-size:12px;padding:8px 10px;border-radius:6px;background:var(--panel);color:var(--ink2)}
.msg.err{background:#fde8e4;color:#8a1c0a}
.msg.ok{background:#e6f4dc;color:#1f5a14}
#modal{position:fixed;inset:0;z-index:60;background:rgba(24,41,31,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:12px;max-width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px;padding:16px;overflow:auto}
.mbox img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;display:block}
.mact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mact .btn{width:auto;min-width:150px}
.mhint{font-size:12px;color:var(--ink2);flex:1 1 260px}

.app.menu{grid-template-columns:minmax(0,1fr)}
.app.menu .side,.app.menu .top,.app.menu #foot{display:none}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,36%);min-height:max(560px,calc(100vh - 150px));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.hl{padding:40px 44px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;min-width:0}
.hlogo{width:min(300px,75%);height:auto;display:block}
.eyebrow{font:800 12px var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:22px 0 0}
.hbot{align-self:flex-end;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hstrip{width:96px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--s1) 0 5%,var(--s2) 5% 35%,var(--s3) 35% 65%,var(--s4) 65% 95%,var(--s5) 95% 100%);margin-bottom:4px}
.h1t{font:800 22px/1.15 var(--font-display);color:var(--brand)}
.h2t{font:600 14px/1.3 var(--font-body);color:var(--ink2)}
.hp{min-height:260px;position:relative}
.hp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:42% 45%;display:block;max-width:none}
.org{display:flex;gap:36px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:6px 0 4px}
.og{display:flex;flex-direction:column;align-items:center}
.stem{width:0;height:26px;border-left:2px solid #b9c6bb}
.kids{display:flex;justify-content:center}
.kid{position:relative;padding:26px 9px 0;display:flex;justify-content:center}
.kid::before,.kid::after{content:'';position:absolute;top:0;width:50%;height:0;border-top:2px solid #b9c6bb}
.kid::before{left:0}.kid::after{right:0}
.kid:first-child::before,.kid:last-child::after{display:none}
.kid .vt{position:absolute;top:0;left:50%;height:26px;border-left:2px solid #b9c6bb;transform:translateX(-1px)}
.node{width:250px;max-width:100%;border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:3px}
.node.co{border-color:var(--brand);background:var(--panel)}
.node .nm{font:800 16px/1.2 var(--font-display)}
.node .cg{font:700 11px var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.node .rg{font-size:12.5px;color:var(--ink2);min-height:34px}
.node .pc{display:flex;align-items:center;gap:8px;margin-top:4px}
.pill{font:800 20px var(--font-display);padding:3px 12px;border-radius:8px;border:1px solid rgba(0,0,0,.28);font-variant-numeric:tabular-nums;color:#18291f}
.node .tn{font:800 12px var(--font-display);color:var(--ink2)}
.node .rv{font-size:11.5px;color:var(--muted);line-height:1.35;min-height:32px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin-top:14px}
.sec{font:800 18px var(--font-display);color:var(--brand);margin:24px 0 2px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.two h4{font:800 12px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:6px 0 8px}
@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hl{padding:28px 24px}
  .hp{min-height:340px}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .scroll{max-height:200px}
  .top h1{font-size:22px}
  .rp{grid-template-columns:26px minmax(0,1fr) 56px;gap:8px}
  .rp .rk-track,.rp .chip{display:none}
  .cardhead{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){#tip{transition:none}}
</style>

</head>

<script>
/* Leitura do Scorecard SSMA Agrícola: recebe {nomeDaAba: matriz[linha][coluna]} e devolve os dados do painel */
const SHEETS = [
  ['Norte', 'Regional Norte Diretoria'],
  ['Expansão', 'Regional Expansão Diretoria'],
  ['Centro', 'Regional Centro Diretoria'],
  ['Sul', 'Regional Sul Diretoria'],
  ['Extremo Sul', 'Regional E. Sul Diretoria']
];
const MES_ABR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const SMALL = new Set(['DE','DA','DO','DAS','DOS','E']);
function titleCase(s) {
  return s.toLowerCase().split(/(\s+|-)/).map((w, i) => {
    if (!w.trim() || w === '-') return w;
    if (w === 'sta') return 'Sta.';
    if (SMALL.has(w.toUpperCase()) && i > 0) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join('');
}
function serialToLabel(v) {
  let d;
  if (v instanceof Date) d = v;
  else if (typeof v === 'number') d = new Date(Math.round((v - 25569) * 86400000));
  else return null;
  return MES_ABR[d.getUTCMonth()] + '/' + String(d.getUTCFullYear()).slice(2);
}
const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
function parseWorkbook(sheets) {
  const out = { entidades: [], meses: [], avisos: [] };
  let mesesRef = null;
  const raw = [];
  SHEETS.forEach(([reg, sn]) => {
    const rows = sheets[sn];
    if (!rows) { out.avisos.push('Aba não encontrada: ' + sn); return; }
    const cell = (r, c) => (rows[r - 1] || [])[c - 1];
    const titles = [];
    for (let r = 1; r <= rows.length; r++) {
      const v = cell(r, 2);
      if (typeof v === 'string' && v.trim().toUpperCase().startsWith('SCORECARD')) titles.push(r);
    }
    titles.forEach((t, i) => {
      const end = i + 1 < titles.length ? titles[i + 1] : rows.length + 1;
      if (!mesesRef) {
        const lab = [];
        for (let c = 9; c <= 20; c++) lab.push(serialToLabel(cell(t, c)));
        if (lab.every(Boolean)) mesesRef = lab;
      }
      const titulo = cell(t, 2).trim().replace(/^SCORECARD\s+/i, '').trim();
      const inds = []; let score = null;
      for (let r = t + 1; r < end; r++) {
        const d = cell(r, 4);
        const vals = []; for (let c = 9; c <= 20; c++) vals.push(cell(r, c));
        const tot = cell(r, 21);
        if (typeof d === 'string' && d.trim()) {
          const nome = d.trim();
          const vv = vals.map(v => num(v));
          vals.forEach((v, k) => { if (v != null && vv[k] == null && typeof v === 'string') out.avisos.push(`${titulo}: valor de texto ignorado em "${nome}" (${v})`); });
          inds.push({ nome, meta: num(cell(r, 7)), peso: num(cell(r, 8)), vals: vv, total: num(tot) });
        } else if (score === null && inds.length >= 10 && [...vals, tot].some(v => num(v) != null)) {
          score = { vals: vals.map(num), total: num(tot) };
        }
      }
      raw.push({ regional: reg, titulo, inds, score, primeiro: i === 0 });
    });
  });
  const meses = mesesRef || ['Jul/26','Ago/26','Set/26','Out/26','Nov/26','Dez/26','Jan/27','Fev/27','Mar/27','Abr/27','Mai/27','Jun/27'];
  // meses com lançamento: a Taxa de Conclusão CVV (primeira linha) preenchida em alguma unidade
  const ativo = meses.map((_, k) => raw.some(e => e.inds[0] && e.inds[0].vals[k] != null));
  const idx = ativo.map((a, k) => a ? k : -1).filter(k => k >= 0);
  out.meses = idx.map(k => meses[k]);
  raw.forEach(e => {
    if (!e.inds.length || !e.score) return;
    const cvv = e.inds[0].vals;
    const temDado = idx.some(k => cvv[k] != null) &&
      e.inds.some(i => idx.some(k => (i.vals[k] || 0) !== 0));  // bloco só com zeros = sem lançamento
    const T = e.titulo.toUpperCase();
    let tipo = e.primeiro ? 'regional' : /^FAZENDAS\b/.test(T) ? 'fazendas' : /MANUTEN|COLHEITA/.test(T) ? 'apoio' : 'fazenda';
    let nome = tipo === 'regional' ? 'Regional ' + e.regional
      : tipo === 'fazendas' ? 'Todas as fazendas'
      : titleCase(T.replace(/^FAZ\.\s*/, '').replace(/\s*(NORTE|SUL|CENTRO|EXPANSÃO|E\. SUL)\s*$/, tipo === 'apoio' ? '' : '$&'));
    if (tipo === 'apoio') nome = /MANUTEN/.test(T) ? 'Manutenção' : 'Colheita';
    if (!temDado) { out.avisos.push(`${e.regional} / ${nome}: sem lançamentos, unidade fora do painel`); return; }
    out.entidades.push({
      id: e.regional + '|' + nome, regional: e.regional, nome, tipo,
      inds: e.inds.map(i => ({ nome: i.nome, meta: i.meta, vals: idx.map(k => i.vals[k]), total: i.total })),
      score: { vals: idx.map(k => (e.inds[0].vals[k] != null ? e.score.vals[k] : null)), total: e.score.total }
    });
  });
  return out;
}
//if (typeof module !== 'undefined') module.exports = { parseWorkbook };

function viewGeral() {

/* ---------- menu principal e hierarquia ---------- */
const HIER = {
  coord: [
    { id: 'walter', nome: 'Walter Soares', cargo: 'Coordenador', regs: ['Norte', 'Expansão', 'Centro'] },
    { id: 'sergio', nome: 'Sérgio Cosac', cargo: 'Coordenador', regs: ['Sul', 'Extremo Sul'] }
  ],
  sup: [
    { id: 'marcell', nome: 'Marcell Monteiro', cargo: 'Supervisor', regs: ['Centro'], coord: 'walter' },
    { id: 'narciso', nome: 'Narciso Teixeira', cargo: 'Supervisor', regs: ['Norte'], coord: 'walter' },
    { id: 'gustavo', nome: 'Gustavo Arruda', cargo: 'Supervisor', regs: ['Expansão', 'Sul', 'Extremo Sul'], coord: 'sergio' }
  ]
};
const regsTxt = rs => rs.length > 1 ? rs.slice(0, -1).join(', ') + ' e ' + rs[rs.length - 1] : (rs[0] || '');
const regsLabel = rs => (rs.length > 1 ? 'Regionais ' : 'Regional ') + regsTxt(rs);
const ctxH = () => `Safra ${ST.safra} · Percentual do Scorecard · ${mesLabel()} · ${scopeText()}`;
function hierData() {
  const sel = new Set(activeRegs());
  const person = p => { const rs = REGS.filter(r => p.regs.includes(r) && sel.has(r)); const vals = rs.map(r => ({ r, v: unitVal(regionalOf(r), 'score') })); return Object.assign({}, p, { rs, vals, val: mean(vals.map(x => x.v)) }); };
  const coords0 = HIER.coord.filter(c => !ST.coord.size || ST.coord.has(c.id)).map(person).filter(c => c.rs.length);
  const sups = HIER.sup.filter(s => (!ST.sup.size || ST.sup.has(s.id)) && coords0.some(c => c.id === s.coord)).map(person).filter(s => s.rs.length);
  return { coords: coords0.filter(c => sups.some(s => s.coord === c.id)), sups };
}
const personUnits = p => p.rs.flatMap(r => unitsOf(r)).filter(e => (e.tipo === 'fazenda' || ST.apoio) && (!ST.faz.size || ST.faz.has(e.id)))
  .map(e => ({ nome: e.nome, tag: e.tipo === 'apoio' ? 'Apoio' : '', sub: 'Regional ' + e.regional, val: unitVal(e, 'score'), meta: 0.9 }));
function nodeHtml(p, co) {
  const t = tier('score', p.val), tip = `${p.nome} · ${regsLabel(p.rs)} · ${fmt('score', p.val)}${t ? ' · ' + TIER[t].n : ''}`;
  return `<div class="node${co ? ' co' : ''}" data-tip="${esc(tip)}"><div class="nm">${esc(p.nome)}</div><div class="cg">${p.cargo}</div><div class="rg">${esc(regsLabel(p.rs))}</div>
    <div class="pc"><span class="pill" style="background:${t ? TIER[t].c : '#e0e7dd'}">${fmt('score', p.val)}</span>${t ? `<span class="tn">${TIER[t].n}</span>` : ''}</div>
    <div class="rv">${p.vals.map(x => esc(x.r) + ' ' + fmt('score', x.v)).join(' · ')}</div></div>`;
}
function kidsOf(c, sups) {
  return sups.filter(s => s.rs.some(r => c.rs.includes(r))).map(s => { const vals = s.vals.filter(x => c.rs.includes(x.r)); return Object.assign({}, s, { rs: s.rs.filter(r => c.rs.includes(r)), vals, val: mean(vals.map(x => x.v)) }); });
}
function orgHtml(coords, sups) {
  return '<div class="org">' + coords.map(c => {
    const kids = sups.filter(s => s.coord === c.id);
    return `<div class="og">${nodeHtml(c, true)}<div class="stem"></div><div class="kids">${kids.map(s => `<div class="kid"><i class="vt"></i>${nodeHtml(s, false)}</div>`).join('')}</div></div>`;
  }).join('') + '</div>';
}
function boxSvg(x, y, p, co) {
  const BW = 250, t = tier('score', p.val), tl = wrapText(regsLabel(p.rs), 34).slice(0, 2);
  let s = `<rect x="${x}" y="${y}" width="${BW}" height="182" rx="10" fill="${co ? '#f6f8f3' : '#fff'}" stroke="${co ? '#006B2D' : '#cfd8cc'}" stroke-width="2"/>`;
  s += `<text x="${x + 14}" y="${y + 28}" font-size="16" font-weight="800" fill="#18291f">${esc(p.nome)}</text>`;
  s += `<text x="${x + 14}" y="${y + 46}" font-size="10.5" font-weight="700" fill="#6f7f74" letter-spacing=".8">${p.cargo.toUpperCase()}</text>`;
  tl.forEach((l, i) => { s += `<text x="${x + 14}" y="${y + 68 + i * 15}" font-size="12.5" fill="#465a4d">${esc(l)}</text>`; });
  s += `<rect x="${x + 14}" y="${y + 104}" width="104" height="36" rx="8" fill="${t ? TIER[t].c : '#e0e7dd'}" stroke="rgba(0,0,0,.28)"/><text x="${x + 66}" y="${y + 129}" text-anchor="middle" font-size="20" font-weight="800" fill="#18291f">${fmt('score', p.val)}</text>`;
  if (t) s += `<text x="${x + 128}" y="${y + 127}" font-size="12.5" font-weight="800" fill="#465a4d">${TIER[t].n}</text>`;
  const parts = p.vals.map(v => v.r + ' ' + fmt('score', v.v)), ls = [];
  for (let i = 0; i < parts.length; i += 2) ls.push(parts.slice(i, i + 2).join(' · '));
  ls.slice(0, 2).forEach((l, i) => { s += `<text x="${x + 14}" y="${y + 158 + i * 14}" font-size="11" fill="#6f7f74">${esc(l)}</text>`; });
  return s;
}
function orgSvg(coords, sups) {
  const BW = 250, BH = 182, G = 24, GG = 44, V = 64; let x = 0, out = '', ln = '';
  coords.forEach(c => {
    const kids = sups.filter(s => s.coord === c.id), n = Math.max(1, kids.length), w = n * BW + (n - 1) * G, cx = x + w / 2, rail = BH + V / 2;
    out += boxSvg(cx - BW / 2, 0, c, true); ln += `M${cx},${BH}V${rail}`;
    if (kids.length) {
      const cs = kids.map((_, i) => x + (kids.length === 1 ? (w - BW) / 2 : i * (BW + G)) + BW / 2);
      ln += `M${cs[0]},${rail}H${cs[cs.length - 1]}`;
      kids.forEach((s, i) => { ln += `M${cs[i]},${rail}V${BH + V}`; out += boxSvg(cs[i] - BW / 2, BH + V, s, false); });
    }
    x += w + GG;
  });
  return { inner: `<path d="${ln}" stroke="#b9c6bb" stroke-width="2" fill="none"/>` + out, w: x - GG, h: BH * 2 + V };
}
function viewMenu() {
  return `<section class="hero" aria-label="Menu Principal"><div class="hl"><div><img class="hlogo" alt="Citrosuco" src="${LOGO_URI}"><p class="eyebrow">Menu Principal</p></div>

}
function viewHier() {
  const { coords, sups } = hierData();
  if (!coords.length) return '<div class="empty">Nenhuma coordenação ou supervisão para os filtros escolhidos.</div>';
  const mk = p => ({ nome: p.nome, sub: regsLabel(p.rs), val: p.val, meta: 0.9 });
  const rc = coords.map(mk).sort(sortDir('score', ST.ord)), rsu = sups.map(mk).sort(sortDir('score', ST.ord));
  const ordTxt = ST.ord === 'best' ? 'do melhor para o pior' : 'do pior para o melhor';
  EXP['org'] = () => { const o = orgSvg(coords, sups), W = Math.max(o.w, 560); return { title: 'Organograma · percentual do Scorecard', sub: ctxH(), w: W, h: o.h, inner: `<g transform="translate(${(W - o.w) / 2},0)">${o.inner}</g>`, meta: false }; };
  EXP['hc'] = () => { const r = rankSvg(rc, 'score', 820); return { title: 'Ranking por coordenação', sub: ctxH(), w: 820, h: r.h, inner: r.g }; };
  EXP['hs'] = () => { const r = rankSvg(rsu, 'score', 820); return { title: 'Ranking por supervisão', sub: ctxH(), w: 820, h: r.h, inner: r.g }; };
  const crit = (p, id) => {
    const rl = p.vals.map(x => ({ nome: 'Regional ' + x.r, val: x.v, meta: 0.9 })).filter(i => i.val != null).sort((a, b) => a.val - b.val);
    const fz = personUnits(p).filter(i => i.val != null).sort((a, b) => a.val - b.val).slice(0, 5), t = tier('score', p.val);
    EXP[id] = () => {
      const a = rankSvg(rl, 'score', 820), b = rankSvg(fz, 'score', 820), ttl = s => `<text x="0" y="16" font-size="14" font-weight="800" fill="#006B2D">${s}</text>`;
      const st = stackSvg(820, [{ inner: ttl('Regionais, da mais crítica') + `<g transform="translate(0,28)">${a.g}</g>`, h: 28 + a.h, gap: 18 }, { inner: ttl('Fazendas mais críticas') + `<g transform="translate(0,28)">${b.g}</g>`, h: 28 + b.h }]);
      return { title: p.nome + ' · ' + fmt('score', p.val), sub: p.cargo + ' · ' + regsLabel(p.rs) + ' · ' + ctxH(), w: 820, h: st.h, inner: st.inner };
    };
    return `<div class="card">${head(p.nome, p.cargo + ' · ' + regsLabel(p.rs), id, `<span class="chip" style="background:${t ? TIER[t].c : '#e0e7dd'};font-size:14px">${fmt('score', p.val)}</span>`)}
      <div class="two"><div><h4>Regionais, da mais crítica</h4><div class="rk">${rankRows(rl, 'score') || '<div class="empty">Sem dado.</div>'}</div></div>
      <div><h4>Fazendas mais críticas</h4><div class="rk">${rankRows(fz, 'score') || '<div class="empty">Sem fazendas para este filtro.</div>'}</div></div></div></div>`;
  };
  return `<div class="card">${head('Organograma', 'Percentual do Scorecard de cada coordenação e supervisão · ' + mesLabel(), 'org')}${orgHtml(coords, sups)}</div>
  <div class="cols2">
    <div class="card">${head('Ranking por coordenação', mesLabel() + ' · ' + ordTxt, 'hc')}<div class="rk">${rankRows(rc, 'score')}</div></div>
    <div class="card">${head('Ranking por supervisão', mesLabel() + ' · ' + ordTxt, 'hs')}<div class="rk">${rankRows(rsu, 'score')}</div></div>
  </div>
  <h2 class="sec">Regionais e fazendas mais críticas por coordenação</h2>
  <div class="cols2" style="margin-top:8px">${coords.map(c => crit(c, 'kc-' + c.id)).join('')}</div>
  <h2 class="sec">Regionais e fazendas mais críticas por supervisão</h2>
  <div class="cols2" style="margin-top:8px">${sups.map(s => crit(s, 'ks-' + s.id)).join('')}</div>
  <p class="note">O percentual de cada pessoa é a média do percentual do Scorecard das regionais dela. Marcell Monteiro e Narciso Teixeira respondem ao coordenador Walter Soares; Gustavo Arruda responde ao coordenador Sérgio Cosac.</p>`;
}

/* ---------- filtros e render ---------- */
function fmtDate(iso) { try { return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }).replace(', ', ' às '); } catch (e) { return ''; } }
function buildFilters() {

  $('#f-sup').innerHTML = HIER.sup.map(s => `<label class="chk"><input type="checkbox" data-sup="${s.id}" ${ST.sup.has(s.id) ? 'checked' : ''}><span>${esc(s.nome)}</span></label>`).join('');
  $('#f-reg').innerHTML = REGS.filter(regionalOf).map(r => `<label class="chk"><input type="checkbox" data-reg="${esc(r)}" ${ST.reg.has(r) ? 'checked' : ''}><span>Regional ${esc(r)}</span></label>`).join('');

  $('#f-faz').innerHTML = regs.map(r => `<div class="grp">${esc(r)}</div>` + unitsOf(r).map(e => `<label class="chk"><input type="checkbox" data-faz="${esc(e.id)}" ${ST.faz.has(e.id) ? 'checked' : ''}><span>${esc(e.nome)}</span>${e.tipo === 'apoio' ? '<small>Apoio</small>' : ''}</label>`).join('')).join('');
  const names = DATA.entidades.length ? DATA.entidades[0].inds.map(i => i.nome) : [];
